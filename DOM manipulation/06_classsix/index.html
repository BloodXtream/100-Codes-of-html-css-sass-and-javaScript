<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task management</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <main>
        <h1 class="title">Focus on <span>Today</span></h1>

        <div class="app-container">

            <h2 class="subtitle">Today <span>🌞</span></h2>
            <p class="progress-lable">Rasie the bar by compleating your Goals!</p>

            <div class="progress-bar show-error">
                <div class="progress-value"><span>2/3 Compleated</span></div>
                <p class="error-lable">Please set all the 3 Goals!</p>
            </div>

            <div class="goal-container first ">
                <div class="custom-checkbox">
                    <img class="check-icon" src="Group 1.svg" alt="">
                </div>
                <input class="goal-input" type="text" placeholder="Add a new Goal...">
            </div>

            <div class="goal-container ">
                <div class="custom-checkbox">
                    <img class="check-icon" src="Group 1.svg" alt="">
                </div>
                <input class="goal-input" type="text" placeholder="Add a new Goal...">
            </div>

            <div class="goal-container">
                <div class="custom-checkbox">
                    <img class="check-icon" src="Group 1.svg" alt="">
                </div>
                <input class="goal-input" type="text" placeholder="Add a new Goal...">
            </div>

            <p class="quote">"Move one step ahead, today!"</p>
        </div>
    </main>

    <script src="./script.js"></script>
</body>

</html>
